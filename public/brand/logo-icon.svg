<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">One More Token 图标</title>
  <desc id="desc">三个彩色 token 词元块坐在同一基线上，后跟一个绿色发光光标，象征一词未尽、继续生成。</desc>
  <defs>
    <linearGradient id="omt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101425"/>
      <stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="omt-caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="omt-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#omt-bg)"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="#6ee7ff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- token 序列：基线对齐，高度错落，如一行正在生成的文字 -->
  <g filter="url(#omt-glow)">
    <rect x="22" y="54" width="18" height="26" rx="5" fill="#7dd3fc"/>
    <rect x="46" y="46" width="22" height="34" rx="5" fill="#a78bfa"/>
    <rect x="74" y="56" width="18" height="24" rx="5" fill="#f472b6"/>
    <rect x="98" y="48" width="7" height="32" rx="2.5" fill="url(#omt-caret)"/>
  </g>
</svg>

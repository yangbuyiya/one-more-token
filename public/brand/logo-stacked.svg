<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">One More Token ｜一词未尽 竖排标识</title>
  <desc id="desc">图标居中在上，英文主名与中文副名居中在下。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101425"/>
      <stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="320" height="360" rx="24" fill="url(#bg)"/>
  <rect width="320" height="360" rx="24" fill="none" stroke="#6ee7ff" stroke-opacity="0.14"/>

  <g transform="translate(96,20)">
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>
    <rect width="128" height="128" rx="28" fill="none" stroke="#6ee7ff" stroke-opacity="0.22" stroke-width="1.5"/>
    <g filter="url(#glow)">
      <rect x="22" y="54" width="18" height="26" rx="5" fill="#7dd3fc"/>
      <rect x="46" y="46" width="22" height="34" rx="5" fill="#a78bfa"/>
      <rect x="74" y="56" width="18" height="24" rx="5" fill="#f472b6"/>
      <rect x="98" y="48" width="7" height="32" rx="2.5" fill="url(#caret)"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="160" y="212" font-size="25" font-weight="700" letter-spacing="1.5" fill="url(#brand)">ONE MORE TOKEN</text>
    <text x="160" y="252" font-size="17" letter-spacing="10" fill="#8f95ab" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">一词未尽 · 继续生成</text>
  </g>

  <!-- 底部装饰 token 序列 -->
  <g transform="translate(0,300)" text-anchor="middle" font-family="'SFMono-Regular','JetBrains Mono',Consolas,monospace" font-size="12">
    <rect x="52" y="-14" width="34" height="24" rx="5" fill="#7dd3fc" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <rect x="94" y="-14" width="34" height="24" rx="5" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="136" y="-14" width="34" height="24" rx="5" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.4"/>
    <rect x="178" y="-14" width="34" height="24" rx="5" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.4"/>
    <rect x="220" y="-14" width="34" height="24" rx="5" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="69" y="3" fill="#7dd3fc">one</text>
    <text x="111" y="3" fill="#a78bfa">more</text>
    <text x="153" y="3" fill="#f472b6">token</text>
    <text x="195" y="3" fill="#4ade80">+1</text>
    <text x="237" y="3" fill="#fbbf24">∞</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">One More Token 纯文字标识</title>
  <desc id="desc">渐变英文主名与中文副名，适合作为页眉文字标识。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <g font-family="'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="0" y="88" font-size="62" font-weight="700" letter-spacing="1" fill="url(#brand)">ONE MORE TOKEN</text>
    <text x="4" y="152" font-size="30" letter-spacing="16" fill="#8f95ab" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">一词未尽 · 继续生成</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" role="img" aria-labelledby="title desc">
  <title id="title">One More Token ｜一词未尽 组合标识</title>
  <desc id="desc">深色圆角图标在左，右侧为英文主名 One More Token 与中文副名一词未尽。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101425"/>
      <stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="icon-clip"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <rect width="560" height="128" rx="20" fill="url(#bg)"/>
  <rect width="560" height="128" rx="20" fill="none" stroke="#6ee7ff" stroke-opacity="0.14"/>

  <!-- icon -->
  <g>
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>
    <rect width="128" height="128" rx="28" fill="none" stroke="#6ee7ff" stroke-opacity="0.22" stroke-width="1.5"/>
    <g filter="url(#glow)">
      <rect x="22" y="54" width="18" height="26" rx="5" fill="#7dd3fc"/>
      <rect x="46" y="46" width="22" height="34" rx="5" fill="#a78bfa"/>
      <rect x="74" y="56" width="18" height="24" rx="5" fill="#f472b6"/>
      <rect x="98" y="48" width="7" height="32" rx="2.5" fill="url(#caret)"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="152" y="60" font-size="34" font-weight="700" letter-spacing="1.5" fill="url(#brand)">ONE MORE TOKEN</text>
    <text x="154" y="96" font-size="18" letter-spacing="9" fill="#8f95ab" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">一词未尽 · 继续生成</text>
  </g>
</svg>
